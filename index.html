<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Tencd团队引导页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        /* 全屏背景层 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("https://api.yppp.net/api.php") center center / cover no-repeat;
            z-index: -2;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* 主容器居中 */
        .main-box {
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            padding: 80px 0;
            text-align: center;
        }

        /* 圆形头像容器：确保图片完全覆盖 */
        .logo-wrap {
            width: 140px;
            height: 140px;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            background: rgba(60,60,70,0.35);
            backdrop-filter: blur(12px);
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* 关键：超出部分隐藏 */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.9s ease forwards;
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 关键：完全覆盖容器，无留白 */
            display: block;
        }

        /* 标题 */
        .site-title {
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.9s ease 0.2s forwards;
        }
        .site-subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            opacity: 0.75;
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.9s ease 0.3s forwards;
        }

        /* 分割线 */
        .divider {
            width: 75%;
            height: 1px;
            background: rgba(255,255,255,0.18);
            margin: 0 auto 35px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.9s ease 0.4s forwards;
        }

        /* 简介文案 */
        .desc-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #d0d0e0;
            margin-bottom: 50px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.9s ease 0.5s forwards;
        }

        /* 按钮样式 */
        .enter-btn {
            display: inline-block;
            padding: 15px 55px;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 50px;
            background: rgba(55,55,65,0.38);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            transition: all 0.35s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.9s ease 0.6s forwards;
        }
        .enter-btn:hover {
            background: rgba(80,80,95,0.5);
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 0 15px rgba(120,140,255,0.25);
        }

        /* 入场上浮动画 */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- 背景层 -->
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <!-- 主内容区 -->
    <div class="main-box">
        <!-- 头像：直接读取同目录 1.jpg，无需文件夹 -->
        <div class="logo-wrap">
            <img src="1.jpg" alt="SD团队" class="logo-img">
        </div>

        <h1 class="site-title">SD团队</h1>
        <p class="site-subtitle">欢迎访问SD Tencd专属引导页</p>

        <div class="divider"></div>

        <p class="desc-text">
            专注游戏体验与极致稳定性开发<br>
            用心打造不一样的游戏体验
        </p>

        <!-- 唯一按钮+指定链接 -->
        <a href="https://qun.qq.com/universal-share/share?ac=1&authKey=jlYDt9CjupAm90gFgykSM3bMjvSj2aqGjySO1urORbxuEFbiCNZKueLKAaY4Wlbx&busi_data=eyJncm91cENvZGUiOiI0NTE3Mjg3NjAiLCJ0b2tlbiI6ImhLazNJTnZWeS9nSTdpZUlFQUxvVUxxWWlrWEpXYnN4dS9qM2lWOWFWOFI5eWRieDVRRVJnb3JSaUljNENSUGkiLCJ1aW4iOiIyMDUxMzkyOTU3In0%3D&data=Ygl7ZSXwUbuDUjq7plZF8TAkatDkPXBmQyQDLC4jK-Hr7sdv3W6Ar6xgbK2nkdVM2DAU_JM6B1Mi92nBb7vsew&svctype=4&tempid=h5_group_info" target="_blank" class="enter-btn">SDTencd项目总群</a>
    </div>
</body>
</html>
